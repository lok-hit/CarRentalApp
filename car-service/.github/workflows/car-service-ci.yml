name: Car Service CI

on:
  push:
    paths:
      - 'car-service/**'
      - 'pom.xml'
    branches:
      - develop
      - main
  pull_request:
    paths:
      - 'car-service/**'
      - 'pom.xml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build & Test
        run: mvn -B -q clean verify -pl car-service -am

      - name: Build Docker image
        working-directory: car-service
        run: docker build -t car-service:ci .
