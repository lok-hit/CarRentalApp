<app-navbar (menuToggled)="sidenav.toggle()" />

<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #sidenav mode="over" class="sidenav">
    <mat-nav-list>
      <a mat-list-item routerLink="/dashboard" routerLinkActive="active-item" (click)="sidenav.close()">
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>Dashboard</span>
      </a>
      <a mat-list-item routerLink="/cars" routerLinkActive="active-item" (click)="sidenav.close()">
        <mat-icon matListItemIcon>directions_car</mat-icon>
        <span matListItemTitle>Samochody</span>
      </a>
      <a mat-list-item routerLink="/reservations" routerLinkActive="active-item" (click)="sidenav.close()">
        <mat-icon matListItemIcon>event</mat-icon>
        <span matListItemTitle>Rezerwacje</span>
      </a>
      <a mat-list-item routerLink="/profile" routerLinkActive="active-item" (click)="sidenav.close()">
        <mat-icon matListItemIcon>account_circle</mat-icon>
        <span matListItemTitle>Profil</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="content">
    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>
