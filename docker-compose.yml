version: "3.9"

services:

  # ============================
  # SERVICE DISCOVERY
  # ============================
  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - carrental
    environment:
      - JAVA_OPTS=-Xms256m -Xmx512m

  # ============================
  # API GATEWAY
  # ============================
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    depends_on:
      - eureka-server
      - redis
      - keycloak
    ports:
      - "8080:8080"
    networks:
      - carrental
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - REDIS_HOST=redis
      - KEYCLOAK_URL=http://keycloak:8080

  # ============================
  # MONITORING SERVICE
  # ============================
  monitoring-service:
    build: ./monitoring-service
    container_name: monitoring-service
    depends_on:
      - eureka-server
      - mongodb
      - otel-collector
    ports:
      - "8085:8085"
    networks:
      - carrental
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - MONGODB_URI=mongodb://mongodb:27017/monitoring
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317

  # ============================
  # DOMAIN SERVICES
  # ============================
  car-service:
    build: ./car-service
    container_name: car-service
    depends_on:
      - eureka-server
    networks:
      - carrental
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/

  reservation-service:
    build: ./reservation-service
    container_name: reservation-service
    depends_on:
      - eureka-server
      - car-service
    networks:
      - carrental
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/

  payment-service:
    build: ./payment-service
    container_name: payment-service
    depends_on:
      - eureka-server
    networks:
      - carrental
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/

  user-profile-service:
    build: ./user-profile-service
    container_name: user-profile-service
    depends_on:
      - eureka-server
      - mongodb
      - keycloak
    ports:
      - "8087:8087"
    networks:
      - carrental
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - MONGODB_URI=mongodb://mongodb:27017/user_profiles
      - KEYCLOAK_ISSUER_URI=http://keycloak:8080/realms/car-rental

  notification-service:
    build: ./notification-service
    container_name: notification-service
    depends_on:
      - eureka-server
    ports:
      - "8086:8086"
    networks:
      - carrental
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/

  # ============================
  # INFRASTRUCTURE
  # ============================
  mongodb:
    image: mongo:7.0
    container_name: mongodb
    ports:
      - "27017:27017"
    networks:
      - carrental
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7.2-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - carrental

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: keycloak
    command: start-dev
    ports:
      - "9090:8080"
    networks:
      - carrental
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    container_name: otel-collector
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./otel-collector-config.yml:/etc/otelcol-contrib/config.yaml
    networks:
      - carrental

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./k8s/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - carrental

  grafana:
    image: grafana/grafana:10.4.0
    container_name: grafana
    ports:
      - "3000:3000"
    networks:
      - carrental
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin

  zipkin:
    image: openzipkin/zipkin:3.3
    container_name: zipkin
    ports:
      - "9411:9411"
    networks:
      - carrental

networks:
  carrental:
    driver: bridge

volumes:
  mongo_data: