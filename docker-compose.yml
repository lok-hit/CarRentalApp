version: "3.9"

services:

  # ============================
  # SERVICE DISCOVERY
  # ============================
  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - carrental
    environment:
      - JAVA_OPTS=-Xms256m -Xmx512m
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -q -O /dev/null http://localhost:8761/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================
  # API GATEWAY
  # ============================
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    depends_on:
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - carrental
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - REDIS_HOST=redis
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_JWK_SET_URI=http://keycloak:8080/realms/car-rental/protocol/openid-connect/certs

  # ============================
  # MONITORING SERVICE
  # ============================
  monitoring-service:
    build: ./monitoring-service
    container_name: monitoring-service
    depends_on:
      eureka-server:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    ports:
      - "8085:8085"
    networks:
      - carrental
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - MONGODB_URI=mongodb://mongodb:27017/monitoring
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317

  # ============================
  # DOMAIN SERVICES
  # ============================
  car-service:
    build:
      context: .
      dockerfile: car-service/Dockerfile
    container_name: car-service
    depends_on:
      eureka-server:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    ports:
      - "8081:8081"
    networks:
      - carrental
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/cars
      - KEYCLOAK_JWK_SET_URI=http://keycloak:8080/realms/car-rental/protocol/openid-connect/certs
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092

  reservation-service:
    build: ./reservation-service
    container_name: reservation-service
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - carrental
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/

  payment-service:
    build: ./payment-service
    container_name: payment-service
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - carrental
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/

  user-profile-service:
    build:
      context: .
      dockerfile: user-profile-service/Dockerfile
    container_name: user-profile-service
    depends_on:
      eureka-server:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    ports:
      - "8087:8087"
    networks:
      - carrental
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - MONGODB_URI=mongodb://mongodb:27017/user_profiles
      - KEYCLOAK_JWK_SET_URI=http://keycloak:8080/realms/car-rental/protocol/openid-connect/certs

  notification-service:
    build: ./notification-service
    container_name: notification-service
    depends_on:
      eureka-server:
        condition: service_healthy
    ports:
      - "8086:8086"
    networks:
      - carrental
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/

  # ============================
  # INFRASTRUCTURE
  # ============================
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    ports:
      - "9092:9092"
    networks:
      - carrental
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  mongodb:
    image: mongo:7.0
    container_name: mongodb
    ports:
      - "27017:27017"
    networks:
      - carrental
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand(\"ping\").ok' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7.2-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - carrental
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: keycloak
    command: start-dev --import-realm
    ports:
      - "9090:8080"
    networks:
      - carrental
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    volumes:
      - ./keycloak/car-rental-realm.json:/opt/keycloak/data/import/car-rental-realm.json:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 6<>/dev/tcp/localhost/8080 2>/dev/null && echo ok || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    container_name: otel-collector
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./otel-collector-config.yml:/etc/otelcol-contrib/config.yaml
    networks:
      - carrental

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./k8s/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - carrental

  grafana:
    image: grafana/grafana:10.4.0
    container_name: grafana
    ports:
      - "3000:3000"
    networks:
      - carrental
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin

  zipkin:
    image: openzipkin/zipkin:3.3
    container_name: zipkin
    ports:
      - "9411:9411"
    networks:
      - carrental

  # ============================
  # FRONTEND (Angular)
  # ============================
  frontend:
    build: ./frontend
    container_name: frontend
    depends_on:
      api-gateway:
        condition: service_started
    ports:
      - "4200:80"
    networks:
      - carrental

networks:
  carrental:
    driver: bridge

volumes:
  mongo_data: