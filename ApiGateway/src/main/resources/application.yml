spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://auth.example.com/realms/my-realm
  cloud:
    gateway:
      metrics:
        enabled: true
      default-filters:
        # Bezpieczeństwo – nagłówki ochronne
        - AddResponseHeader=X-Frame-Options, DENY
        - AddResponseHeader=X-Content-Type-Options, nosniff
        - AddResponseHeader=Referrer-Policy, no-referrer
        - AddResponseHeader=X-XSS-Protection, "1; mode=block"
        - AddRequestHeader=traceparent, "#{T(io.opentelemetry.api.trace.Span).current().getSpanContext().getTraceId()}"
        - AddRequestHeader=X-Correlation-ID, "#{@correlationIdResolver.resolve()}"
      httpclient:
        connect-timeout: 3000
        response-timeout: 5s
        pool:
          type: fixed
          max-connections: 200
          acquire-timeout: 1000

      routes:
        - id: cars_route
          uri: http://cars-service
          predicates:
            - Path=/cars/**
          filters:
            # Rate limiting (dynamiczny, ale placeholder zostaje)
            - name: RequestRateLimiter
              args:
                rateLimiter: "#{@redisRateLimiter}"
                keyResolver: "#{@userKeyResolver}"

            # Circuit Breaker
            - name: CircuitBreaker
              args:
                name: carsServiceCircuitBreaker
                fallbackUri: forward:/fallback/cars

            # Retry tylko dla GET i błędów 5xx
            - name: Retry
              args:
                retries: 3
                methods: GET
                statuses: BAD_GATEWAY, GATEWAY_TIMEOUT, INTERNAL_SERVER_ERROR

server:
  max-http-header-size: 16KB
  shutdown: graceful

resilience4j:
  metrics:
    enabled: true
  circuitbreaker:
    instances:
      carsServiceCircuitBreaker:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        minimumNumberOfCalls: 5
        automaticTransitionFromOpenToHalfOpenEnabled: true

  retry:
    instances:
      carsRetry:
        maxAttempts: 3
        waitDuration: 200ms
        retryExceptions:
          - org.springframework.web.client.HttpServerErrorException
          - java.io.IOException
          - reactor.netty.http.client.PrematureCloseException

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus, refresh
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: api-gateway
logging:
  pattern:
    level: "%5p [traceId=%X{trace_id} spanId=%X{span_id}]"
  level:
    org.springframework.cloud.gateway: INFO
    reactor.netty.http.client: WARN

cors:
  allowed-origins: "http://localhost:3000"
  allowed-methods: "GET,POST,PUT,DELETE"
  allowed-headers: "Content-Type,Authorization"
otel:
  service:
    name: api-gateway
  exporter:
    otlp:
      endpoint: http://localhost:4317
  traces:
    sampler: parentbased_always_on

scrape_configs:
  - job_name: 'api-gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: [ 'host.docker.internal:8080' ]


monitoring:
  service:
    url: http://monitoring-service
