server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      default-filters:
        - RemoveHopByHopHeaders
        - PreserveHostHeader
      httpclient:
        connect-timeout: 3000
        response-timeout: 5s
        pool:
          type: fixed
          max-connections: 200
          acquire-timeout: 500ms

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus, loggers

  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

  metrics:
    enable:
      jvm: true
      process: true
      system: true
      http: true
      webclient: true
      gateway: true

  tracing:
    enabled: true
    sampling:
      probability: 1.0

  otlp:
    tracing:
      endpoint: http://otel-collector:4317
    metrics:
      export:
        enabled: true
        endpoint: http://otel-collector:4317

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: INFO
    reactor.netty.http.client: INFO
    io.micrometer: INFO
    infrastructure.filters: DEBUG

  pattern:
    level: "%5p [traceId=%X{traceId:-}] [spanId=%X{spanId:-}] [corrId=%X{correlationId:-}]"

info:
  app:
    name: api-gateway
    version: 1.0.0
    description: API Gateway for microservices platform
  build:
    timestamp: "@timestamp@"

gateway:
  monitoring-service:
    url: http://monitoring-service:8085/audit
