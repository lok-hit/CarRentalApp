spring:
  cloud:
    gateway:
      routes:
        - id: cars_route
          uri: http://cars-service
          predicates:
            - Path=/cars/**
          filters:
            - name: RequestRateLimiter
              args:
                rateLimiter: "#{@redisRateLimiter}"
                keyResolver: "#{@userKeyResolver}"

resilience4j:
  circuitbreaker:
    instances:
      carsServiceCircuitBreaker:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s