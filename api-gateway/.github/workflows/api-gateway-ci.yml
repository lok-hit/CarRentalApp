name: ApiGateway CI

on:
  push:
    paths:
      - 'ApiGateway/**'
      - 'CarRentalApp/pom.xml'
    branches:
      - develop
      - main
  pull_request:
    paths:
      - 'ApiGateway/**'
      - 'CarRentalApp/pom.xml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build & Test
        run: mvn -B -q -f CarRentalApp/pom.xml clean verify

      - name: Build Docker image
        working-directory: ApiGateway
        run: |
          docker build -t api-gateway:ci .

