server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

spring:
  application:
    name: api-gateway
  redis:
    host: redis
    port: 6379
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      default-filters:
        - RemoveHopByHopHeaders
        - PreserveHostHeader

      httpclient:
        connect-timeout: 3000
        response-timeout: 5s
        pool:
          type: fixed
          max-connections: 200
          acquire-timeout: 500ms

      routes:
        # Example: reservations service with circuit breaker + rate limiting
        - id: reservations-service
          uri: lb://reservation-service
          predicates:
            - Path=/api/reservations/**
          filters:
            - name: CircuitBreaker
              args:
                name: reservationsCB
                fallbackUri: forward:/fallback/reservations
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userKeyResolver}"

        # Example: canary deployment for cars-service (v1 vs v2)
        - id: cars-service-v1
          uri: lb://cars-service-v1
          predicates:
            - Path=/api/cars/**
          filters:
            - Weight=group-cars, 90

        - id: cars-service-v2
          uri: lb://cars-service-v2
          predicates:
            - Path=/api/cars/**
          filters:
            - Weight=group-cars, 10

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus, loggers

  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

  metrics:
    enable:
      jvm: true
      process: true
      system: true
      http: true
      webclient: true
      gateway: true

  tracing:
    enabled: true
    sampling:
      probability: 1.0

  otlp:
    tracing:
      endpoint: http://otel-collector:4317
    metrics:
      export:
        enabled: true
        endpoint: http://otel-collector:4317

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: INFO
    reactor.netty.http.client: INFO
    io.micrometer: INFO
    infrastructure.filters: DEBUG

  pattern:
    level: "%5p [traceId=%X{traceId:-}] [spanId=%X{spanId:-}] [corrId=%X{correlationId:-}]"

info:
  app:
    name: api-gateway
    version: 1.0.0
    description: API Gateway for microservices platform
  build:
    timestamp: "@timestamp@"

gateway:
  monitoring-service:
    url: http://monitoring-service:8085/audit

resilience4j:
  circuitbreaker:
    instances:
      reservationsCB:
        slidingWindowSize: 20
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
